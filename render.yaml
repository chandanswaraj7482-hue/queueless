services:
  - type: web
    name: queueless-backend
    runtime: node
    plan: free
    region: oregon # USA West - Low Latency Global & US Access
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false # Set to your free Neon.tech PostgreSQL connection string in Render Dashboard
      - key: CORS_ORIGIN
        value: https://queueless-os.vercel.app

