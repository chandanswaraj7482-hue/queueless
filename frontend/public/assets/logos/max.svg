    <path d="M18 4 L31 9 C31 22 24 30 18 34 C12 30 5 22 5 9 L18 4 Z" fill="#047857" />
    <!-- White Medical Cross inside -->
    <rect x="15" y="11" width="6" height="14" rx="1.5" fill="#FFFFFF" />
    <rect x="11" y="15" width="14" height="6" rx="1.5" fill="#FFFFFF" />
